<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Exam Cleaner v2.1｜考卷掃描與校正</title>
<style>
html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#eef2f7}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#1d4ed8;background:#eef2f7;z-index:2;text-align:center;padding:24px;line-height:1.7}
iframe{display:block}
</style>
</head>
<body>
<div id="loading">正在載入 Exam Cleaner v2.1 正式版…<br><small>首次開啟需要網路連線載入影像處理模組</small></div>
<iframe id="app" src="./preview/v2.1/index.html?v=210-20260805-1734" title="Exam Cleaner v2.1"></iframe>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const queue=[
      './enhance-v1.js?v=210-20260805-1734',
      './default-gray-v1.js?v=210-20260805-1734',
      './rc-ui.js?v=210-20260805-1734',
      './detect-grabcut-v1.js?v=210-20260805-1734',
      './touch-corner-handles-v1.js?v=210-20260805-1734',
      './release-ui-v21.js?v=210-20260805-1734',
      'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
      './multipage-v1.js?v=210-20260805-1734'
    ];
    const fail=()=>{
      document.getElementById('loading').textContent='正式版模組載入失敗，請確認網路後關閉分頁再重新開啟。';
    };
    const next=()=>{
      if(!queue.length){document.getElementById('loading').remove();return;}
      const script=doc.createElement('script');
      script.src=queue.shift();
      script.onload=next;
      script.onerror=fail;
      doc.body.appendChild(script);
    };
    next();
  }catch(error){
    document.getElementById('loading').textContent='無法載入正式版：'+error.message;
  }
});
</script>
</body>
</html>
