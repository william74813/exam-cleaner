<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Exam Cleaner｜v2.1 掃描接續 v2.2</title>
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#eef2f7}#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#1d4ed8;background:#eef2f7;z-index:2;text-align:center;padding:24px;line-height:1.7}iframe{display:block}</style>
</head>
<body>
<div id="loading">正在載入掃描器與 v2.2 接續模組…</div>
<iframe id="app" src="../v2.1/index.html?v=v22-handoff-a2" title="Exam Cleaner 掃描器"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const queue=[
      '../v2.1/enhance-v1.js?v=v22-handoff-a2',
      '../v2.1/default-gray-v1.js?v=v22-handoff-a2',
      '../v2.1/rc-ui.js?v=v22-handoff-a2',
      '../v2.1/detect-grabcut-v1.js?v=v22-handoff-a2',
      '../v2.1/touch-corner-handles-v1.js?v=v22-handoff-a2',
      '../v2.1/release-ui-v21.js?v=v22-handoff-a2',
      'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
      '../v2.1/multipage-v1.js?v=v22-handoff-a2',
      '../v2.1/v22-handoff.js?v=v22-handoff-a2'
    ];
    const fail=()=>{document.getElementById('loading').textContent='模組載入失敗，請確認網路後關閉分頁再重開。'};
    const next=()=>{
      if(!queue.length){document.getElementById('loading').remove();return;}
      const script=doc.createElement('script');
      script.src=queue.shift();
      script.onload=next;
      script.onerror=fail;
      doc.body.appendChild(script);
    };
    next();
  }catch(error){document.getElementById('loading').textContent='無法載入：'+error.message;}
});
</script>
</body>
</html>
