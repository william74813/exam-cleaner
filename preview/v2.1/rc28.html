<body>
<div id="loading">正在載入 v2.1 RC2.8：中央紙張遮罩偵測…</div>
<iframe id="app" src="./index.html?v=rc28-20260805-1704" title="Exam Cleaner v2.1 RC2.8"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const queue=[
      './enhance-v1.js?v=rc28-20260805-1704',
      './default-gray-v1.js?v=rc28-20260805-1704',
      './rc-ui.js?v=rc28-20260805-1704',
      './detect-v6.js?v=rc28-20260805-1704',
      './detect-center-mask-v1.js?v=rc28-20260805-1704',
      'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
      './multipage-v1.js?v=rc28-20260805-1704'
    ];
    const fail=()=>{document.getElementById('loading').textContent='RC2.8 模組載入失敗，請確認網路後關閉分頁重開。'};
    const next=()=>{
      if(!queue.length){document.getElementById('loading').remove();return;}
      const script=doc.createElement('script');
      script.src=queue.shift();
      script.onload=next;
      script.onerror=fail;
      doc.body.appendChild(script);
    };
    next();
  }catch(error){document.getElementById('loading').textContent='無法載入 RC2.8：'+error.message;}
});
</script>
</body>
