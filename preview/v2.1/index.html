<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exam Cleaner v2.1 Alpha</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#eef2f7;color:#172033}header{background:#1d4ed8;color:#fff;padding:16px}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;font-size:12px;opacity:.88}main{max-width:1100px;margin:16px auto;padding:0 12px}.grid{display:grid;grid-template-columns:300px 1fr;gap:14px}.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.08)}input[type=file]{width:100%;padding:10px;border:1px dashed #aab4c3;border-radius:10px}.row{display:flex;gap:8px;margin-top:9px}.row>*{flex:1}button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;background:#e5e7eb;color:#172033}button.primary{background:#1d4ed8;color:#fff}button.green{background:#087f5b;color:#fff}button:disabled{opacity:.4}.small{font-size:12px;color:#667085;line-height:1.6}.stage{background:#cbd5e1;border-radius:12px;overflow:auto;padding:12px;min-height:520px;display:flex;justify-content:center;align-items:flex-start}.canvasWrap{position:relative;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.25)}canvas{display:block;max-width:100%;height:auto;touch-action:none}.status{margin-top:10px;padding:10px;border-radius:9px;background:#eff6ff;color:#1e3a8a;font-size:12px}.result{margin-top:14px}.result canvas{width:100%;box-shadow:0 4px 14px rgba(0,0,0,.14)}@media(max-width:760px){.grid{grid-template-columns:1fr}.stage{min-height:390px}}
</style>
</head>
<body>
<header><h1>Exam Cleaner v2.1 Alpha.1</h1><p>手動四角框選＋透視校正測試版</p></header>
<main><div class="grid">
<section class="card">
<label><b>1. 拍照或選擇考卷</b></label>
<input id="file" type="file" accept="image/*" capture="environment">
<p class="small">匯入後，拖曳四個藍色圓點到紙張的四個角。順序固定為左上、右上、右下、左下。</p>
<div class="row"><button id="reset" disabled>重設角點</button><button id="correct" class="primary" disabled>透視校正</button></div>
<div class="row"><button id="download" class="green" disabled>下載校正圖</button><button onclick="location.href='../../'">返回正式版</button></div>
<div id="status" class="status">尚未匯入照片。</div>
<p class="small"><b>本版驗收重點：</b><br>① 角點能否順暢拖曳<br>② 校正後文字是否變形<br>③ 紙張邊緣是否完整保留<br>④ iPhone Safari 是否會卡頓</p>
</section>
<section class="card">
<div class="stage"><div class="canvasWrap"><canvas id="source" width="900" height="1200"></canvas></div></div>
<div class="result" id="resultBox" hidden><h3>校正結果</h3><canvas id="result"></canvas></div>
</section>
</div></main>
<script>
const file=document.getElementById('file'),src=document.getElementById('source'),sctx=src.getContext('2d',{willReadFrequently:true});
const out=document.getElementById('result'),octx=out.getContext('2d');
const correctBtn=document.getElementById('correct'),resetBtn=document.getElementById('reset'),downloadBtn=document.getElementById('download'),statusEl=document.getElementById('status');
let base=null,points=[],drag=-1;
function defaultPoints(){const m=Math.min(src.width,src.height)*.06;points=[{x:m,y:m},{x:src.width-m,y:m},{x:src.width-m,y:src.height-m},{x:m,y:src.height-m}];draw()}
file.onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const max=2200,scale=Math.min(1,max/Math.max(im.width,im.height));src.width=Math.round(im.width*scale);src.height=Math.round(im.height*scale);sctx.drawImage(im,0,0,src.width,src.height);base=sctx.getImageData(0,0,src.width,src.height);defaultPoints();correctBtn.disabled=resetBtn.disabled=false;statusEl.textContent='請拖曳四個藍點到考卷四角，再按「透視校正」。';URL.revokeObjectURL(im.src)};im.src=URL.createObjectURL(f)};
function draw(){if(!base)return;sctx.putImageData(base,0,0);sctx.save();sctx.strokeStyle='#2563eb';sctx.lineWidth=Math.max(3,src.width/350);sctx.beginPath();points.forEach((p,i)=>i?sctx.lineTo(p.x,p.y):sctx.moveTo(p.x,p.y));sctx.closePath();sctx.stroke();points.forEach((p,i)=>{sctx.fillStyle='#2563eb';sctx.beginPath();sctx.arc(p.x,p.y,Math.max(12,src.width/70),0,Math.PI*2);sctx.fill();sctx.fillStyle='#fff';sctx.font=`bold ${Math.max(14,src.width/65)}px sans-serif`;sctx.textAlign='center';sctx.textBaseline='middle';sctx.fillText(String(i+1),p.x,p.y)});sctx.restore()}
function pos(e){const r=src.getBoundingClientRect();return{x:(e.clientX-r.left)*src.width/r.width,y:(e.clientY-r.top)*src.height/r.height}}
src.onpointerdown=e=>{if(!base)return;const p=pos(e),radius=Math.max(28,src.width/35);drag=points.findIndex(q=>Math.hypot(q.x-p.x,q.y-p.y)<radius);if(drag>=0)src.setPointerCapture(e.pointerId)};
src.onpointermove=e=>{if(drag<0)return;const p=pos(e);points[drag]={x:Math.max(0,Math.min(src.width,p.x)),y:Math.max(0,Math.min(src.height,p.y))};draw()};
src.onpointerup=src.onpointercancel=()=>drag=-1;resetBtn.onclick=defaultPoints;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let m=i;for(let j=i+1;j<n;j++)if(Math.abs(A[j][i])>Math.abs(A[m][i]))m=j;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];const d=A[i][i];if(Math.abs(d)<1e-10)throw Error('角點配置無法計算');for(let k=i;k<n;k++)A[i][k]/=d;b[i]/=d;for(let j=0;j<n;j++){if(j===i)continue;const f=A[j][i];for(let k=i;k<n;k++)A[j][k]-=f*A[i][k];b[j]-=f*b[i]}}return b}
function homography(dst,srcp){const A=[],b=[];for(let i=0;i<4;i++){const u=dst[i].x,v=dst[i].y,x=srcp[i].x,y=srcp[i].y;A.push([u,v,1,0,0,0,-x*u,-x*v]);b.push(x);A.push([0,0,0,u,v,1,-y*u,-y*v]);b.push(y)}return solve(A,b)}
function bilinear(data,w,h,x,y){x=Math.max(0,Math.min(w-1,x));y=Math.max(0,Math.min(h-1,y));const x0=Math.floor(x),y0=Math.floor(y),x1=Math.min(w-1,x0+1),y1=Math.min(h-1,y0+1),dx=x-x0,dy=y-y0,r=[];for(let c=0;c<4;c++){const a=data[(y0*w+x0)*4+c]*(1-dx)+data[(y0*w+x1)*4+c]*dx;const b=data[(y1*w+x0)*4+c]*(1-dx)+data[(y1*w+x1)*4+c]*dx;r[c]=a*(1-dy)+b*dy}return r}
correctBtn.onclick=()=>{try{statusEl.textContent='校正運算中，請稍候…';setTimeout(()=>{const top=dist(points[0],points[1]),bottom=dist(points[3],points[2]),left=dist(points[0],points[3]),right=dist(points[1],points[2]);let W=Math.round(Math.max(top,bottom)),H=Math.round(Math.max(left,right));const limit=1500,sc=Math.min(1,limit/Math.max(W,H));W=Math.max(100,Math.round(W*sc));H=Math.max(100,Math.round(H*sc));out.width=W;out.height=H;const dst=[{x:0,y:0},{x:W-1,y:0},{x:W-1,y:H-1},{x:0,y:H-1}],h=homography(dst,points),input=base.data,res=octx.createImageData(W,H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const den=h[6]*x+h[7]*y+1,sx=(h[0]*x+h[1]*y+h[2])/den,sy=(h[3]*x+h[4]*y+h[5])/den,p=bilinear(input,src.width,src.height,sx,sy),i=(y*W+x)*4;res.data[i]=p[0];res.data[i+1]=p[1];res.data[i+2]=p[2];res.data[i+3]=255}octx.putImageData(res,0,0);document.getElementById('resultBox').hidden=false;downloadBtn.disabled=false;statusEl.textContent=`校正完成：${W} × ${H} 像素。請檢查文字及紙張邊緣。`;document.getElementById('resultBox').scrollIntoView({behavior:'smooth'})},30)}catch(err){statusEl.textContent='校正失敗：'+err.message}};
downloadBtn.onclick=()=>{const a=document.createElement('a');a.href=out.toDataURL('image/png');a.download='exam-perspective-corrected.png';a.click()};
</script>
</body></html>
