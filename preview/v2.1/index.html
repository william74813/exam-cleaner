<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exam Cleaner v2.1 Alpha.2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#eef2f7;color:#172033}header{background:#1d4ed8;color:#fff;padding:16px}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;font-size:12px;opacity:.9}main{max-width:1120px;margin:16px auto;padding:0 12px}.grid{display:grid;grid-template-columns:310px 1fr;gap:14px}.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.08)}input[type=file]{width:100%;padding:10px;border:1px dashed #aab4c3;border-radius:10px}.row{display:flex;gap:8px;margin-top:9px}.row>*{flex:1}button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;background:#e5e7eb;color:#172033}button.primary{background:#1d4ed8;color:#fff}button.green{background:#087f5b;color:#fff}button.orange{background:#c2410c;color:#fff}button:disabled{opacity:.42}.small{font-size:12px;color:#667085;line-height:1.6}.stage{background:#cbd5e1;border-radius:12px;overflow:auto;padding:12px;min-height:520px;display:flex;justify-content:center;align-items:flex-start}.canvasWrap{position:relative;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.25)}canvas{display:block;max-width:100%;height:auto;touch-action:none}.status{margin-top:10px;padding:10px;border-radius:9px;background:#eff6ff;color:#1e3a8a;font-size:12px;line-height:1.55}.status.ready{background:#ecfdf3;color:#067647}.status.warn{background:#fff7ed;color:#9a3412}.result{margin-top:14px}.result canvas{width:100%;box-shadow:0 4px 14px rgba(0,0,0,.14)}.badge{display:inline-block;border-radius:999px;padding:3px 8px;background:#dbeafe;color:#1e40af;font-size:11px;font-weight:800}.steps{margin:8px 0;padding-left:20px}.steps li{margin:5px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}.stage{min-height:390px}}
</style>
<script>
window.Module={onRuntimeInitialized(){window.cvReady=true;const s=document.getElementById('status');if(s){s.textContent='OpenCV 已載入。請拍照或選擇考卷。';s.className='status ready'}updateButtons()}};
</script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
</head>
<body>
<header><h1>Exam Cleaner v2.1 Alpha.2 <span class="badge">OpenCV</span></h1><p>自動偵測考卷四角＋手動微調＋透視校正</p></header>
<main><div class="grid">
<section class="card">
<label><b>1. 拍照或選擇考卷</b></label>
<input id="file" type="file" accept="image/*" capture="environment">
<ol class="small steps"><li>匯入後按「自動偵測四角」。</li><li>確認藍色框線；必要時拖曳四個角點。</li><li>按「透視校正」產生乾淨長方形。</li></ol>
<div class="row"><button id="detect" class="orange" disabled>自動偵測四角</button><button id="reset" disabled>重設角點</button></div>
<div class="row"><button id="correct" class="primary" disabled>透視校正</button><button id="download" class="green" disabled>下載校正圖</button></div>
<div class="row"><button onclick="location.href='../../'">返回正式版</button></div>
<div id="status" class="status">OpenCV 載入中，請稍候……</div>
<p class="small"><b>本版驗收重點：</b><br>① 是否能自動框住整張考卷<br>② 是否誤抓題目表格或桌面邊緣<br>③ 偵測失敗後能否手動修正<br>④ 校正後是否裁掉題目<br>⑤ iPhone Safari 是否穩定</p>
</section>
<section class="card">
<div class="stage"><div class="canvasWrap"><canvas id="source" width="900" height="1200"></canvas></div></div>
<div class="result" id="resultBox" hidden><h3>校正結果</h3><canvas id="result"></canvas></div>
</section>
</div></main>
<script>
const file=document.getElementById('file'),src=document.getElementById('source'),sctx=src.getContext('2d',{willReadFrequently:true});
const out=document.getElementById('result');
const detectBtn=document.getElementById('detect'),correctBtn=document.getElementById('correct'),resetBtn=document.getElementById('reset'),downloadBtn=document.getElementById('download'),statusEl=document.getElementById('status');
let base=null,points=[],drag=-1;window.cvReady=false;
function updateButtons(){const loaded=!!base;detectBtn.disabled=!(loaded&&window.cvReady);correctBtn.disabled=!loaded;resetBtn.disabled=!loaded}
function setStatus(text,type=''){statusEl.textContent=text;statusEl.className='status'+(type?' '+type:'')}
function defaultPoints(){const m=Math.min(src.width,src.height)*.06;points=[{x:m,y:m},{x:src.width-m,y:m},{x:src.width-m,y:src.height-m},{x:m,y:src.height-m}];draw()}
file.onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const max=2400,scale=Math.min(1,max/Math.max(im.width,im.height));src.width=Math.max(1,Math.round(im.width*scale));src.height=Math.max(1,Math.round(im.height*scale));sctx.fillStyle='#fff';sctx.fillRect(0,0,src.width,src.height);sctx.drawImage(im,0,0,src.width,src.height);base=sctx.getImageData(0,0,src.width,src.height);defaultPoints();updateButtons();setStatus(window.cvReady?'照片已載入，請按「自動偵測四角」。':'照片已載入，等待 OpenCV 完成載入。');URL.revokeObjectURL(im.src)};im.onerror=()=>setStatus('無法讀取照片，請改用 JPG 或 PNG。','warn');im.src=URL.createObjectURL(f)};
function draw(){if(!base)return;sctx.putImageData(base,0,0);sctx.save();sctx.strokeStyle='#2563eb';sctx.lineWidth=Math.max(3,src.width/350);sctx.beginPath();points.forEach((p,i)=>i?sctx.lineTo(p.x,p.y):sctx.moveTo(p.x,p.y));sctx.closePath();sctx.stroke();points.forEach((p,i)=>{sctx.fillStyle='#2563eb';sctx.beginPath();sctx.arc(p.x,p.y,Math.max(12,src.width/70),0,Math.PI*2);sctx.fill();sctx.fillStyle='#fff';sctx.font=`bold ${Math.max(14,src.width/65)}px sans-serif`;sctx.textAlign='center';sctx.textBaseline='middle';sctx.fillText(String(i+1),p.x,p.y)});sctx.restore()}
function pos(e){const r=src.getBoundingClientRect();return{x:(e.clientX-r.left)*src.width/r.width,y:(e.clientY-r.top)*src.height/r.height}}
src.onpointerdown=e=>{if(!base)return;const p=pos(e),radius=Math.max(30,src.width/30);drag=points.findIndex(q=>Math.hypot(q.x-p.x,q.y-p.y)<radius);if(drag>=0)src.setPointerCapture(e.pointerId)};
src.onpointermove=e=>{if(drag<0)return;const p=pos(e);points[drag]={x:Math.max(0,Math.min(src.width,p.x)),y:Math.max(0,Math.min(src.height,p.y))};draw()};
src.onpointerup=src.onpointercancel=()=>drag=-1;resetBtn.onclick=()=>{defaultPoints();setStatus('角點已重設，請拖曳到紙張四角或重新自動偵測。')};
function orderPoints(raw){const pts=raw.map(p=>({x:p.x,y:p.y}));const sums=pts.map(p=>p.x+p.y),diffs=pts.map(p=>p.y-p.x);return[pts[sums.indexOf(Math.min(...sums))],pts[diffs.indexOf(Math.min(...diffs))],pts[sums.indexOf(Math.max(...sums))],pts[diffs.indexOf(Math.max(...diffs))]]}
function detectDocument(){if(!window.cvReady||!base)return;detectBtn.disabled=true;setStatus('正在分析紙張邊界，請稍候……');setTimeout(()=>{let original,small,gray,blur,edges,kernel,contours,hierarchy;try{sctx.putImageData(base,0,0);original=cv.imread(src);const maxSide=1000,scale=Math.min(1,maxSide/Math.max(original.cols,original.rows));small=new cv.Mat();cv.resize(original,small,new cv.Size(Math.round(original.cols*scale),Math.round(original.rows*scale)),0,0,cv.INTER_AREA);gray=new cv.Mat();blur=new cv.Mat();edges=new cv.Mat();cv.cvtColor(small,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);cv.Canny(blur,edges,55,160);kernel=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(5,5));cv.morphologyEx(edges,edges,cv.MORPH_CLOSE,kernel);contours=new cv.MatVector();hierarchy=new cv.Mat();cv.findContours(edges,contours,hierarchy,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);let best=null,bestArea=0;const minArea=small.cols*small.rows*.12;for(let i=0;i<contours.size();i++){const cnt=contours.get(i),peri=cv.arcLength(cnt,true),approx=new cv.Mat();cv.approxPolyDP(cnt,approx,.02*peri,true);const area=Math.abs(cv.contourArea(approx));if(approx.rows===4&&area>minArea&&area>bestArea&&cv.isContourConvex(approx)){bestArea=area;best=[];for(let j=0;j<4;j++)best.push({x:approx.data32S[j*2]/scale,y:approx.data32S[j*2+1]/scale})}approx.delete();cnt.delete()}if(!best)throw new Error('找不到完整四邊形紙張');points=orderPoints(best);draw();setStatus(`已自動偵測考卷，文件約占畫面 ${Math.round(bestArea/(small.cols*small.rows)*100)}%。請確認藍框後再校正。`,'ready')}catch(err){defaultPoints();setStatus('自動偵測未成功：'+err.message+'。已切回手動角點，請自行拖曳。','warn')}finally{[original,small,gray,blur,edges,kernel,contours,hierarchy].forEach(m=>{try{if(m)m.delete()}catch(e){}});detectBtn.disabled=false}},50)}
detectBtn.onclick=detectDocument;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
correctBtn.onclick=()=>{if(!window.cvReady){setStatus('OpenCV 尚未完成載入，請稍候。','warn');return}setStatus('正在進行透視校正……');setTimeout(()=>{let input,srcPts,dstPts,M,dst;try{sctx.putImageData(base,0,0);input=cv.imread(src);const top=dist(points[0],points[1]),bottom=dist(points[3],points[2]),left=dist(points[0],points[3]),right=dist(points[1],points[2]);let W=Math.round(Math.max(top,bottom)),H=Math.round(Math.max(left,right));const limit=1800,scale=Math.min(1,limit/Math.max(W,H));W=Math.max(120,Math.round(W*scale));H=Math.max(120,Math.round(H*scale));srcPts=cv.matFromArray(4,1,cv.CV_32FC2,points.flatMap(p=>[p.x,p.y]));dstPts=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,W-1,0,W-1,H-1,0,H-1]);M=cv.getPerspectiveTransform(srcPts,dstPts);dst=new cv.Mat();cv.warpPerspective(input,dst,M,new cv.Size(W,H),cv.INTER_CUBIC,cv.BORDER_CONSTANT,new cv.Scalar(255,255,255,255));out.width=W;out.height=H;cv.imshow(out,dst);document.getElementById('resultBox').hidden=false;downloadBtn.disabled=false;setStatus(`校正完成：${W} × ${H} 像素。請檢查四邊及文字是否完整。`,'ready');document.getElementById('resultBox').scrollIntoView({behavior:'smooth'})}catch(err){setStatus('校正失敗：'+err.message,'warn')}finally{[input,srcPts,dstPts,M,dst].forEach(m=>{try{if(m)m.delete()}catch(e){}})}},30)};
downloadBtn.onclick=()=>{const a=document.createElement('a');a.href=out.toDataURL('image/png');a.download='exam-opencv-corrected.png';a.click()};
setTimeout(()=>{if(!window.cvReady)setStatus('OpenCV 載入時間較久，請保持網路連線並稍候；若超過 20 秒請重新整理。','warn')},10000);
</script>
</body></html>
