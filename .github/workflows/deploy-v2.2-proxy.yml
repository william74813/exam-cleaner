name: Deploy v2.2 OpenAI Proxy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '輸入 DEPLOY 確認部署正式 OpenAI Proxy'
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: ${{ github.event.inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run integrity and proxy tests
        run: npm test

      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4'
          command: deploy
          secrets: |
            OPENAI_API_KEY
            ACCESS_TOKEN
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ACCESS_TOKEN: ${{ secrets.EXAM_CLEANER_ACCESS_TOKEN }}

      - name: Verify health endpoint
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --retry 4 --retry-delay 3 "${DEPLOYMENT_URL%/}/health"

      - name: Write deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '## Exam Cleaner v2.2 OpenAI Proxy 已部署' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: ${DEPLOYMENT_URL%/}/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Proxy URL: ${DEPLOYMENT_URL%/}/api/clean" >> "$GITHUB_STEP_SUMMARY"
          echo '- 請勿在 Issue、PR 或聊天貼出 OpenAI API Key 或存取權杖。' >> "$GITHUB_STEP_SUMMARY"
