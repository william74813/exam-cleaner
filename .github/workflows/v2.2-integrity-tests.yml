name: v2.2 integrity tests

on:
  pull_request:
    paths:
      - 'preview/v2.1/v22-handoff-v2.js'
      - 'preview/v2.2/**'
      - 'worker/**'
      - 'workers/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/v2.2-integrity-tests.yml'
      - '.github/workflows/deploy-v2.2-proxy.yml'
  push:
    branches:
      - main
      - feature/v2.2-unified-ai-cleaner
      - feature/v2.2-openai-proxy
    paths:
      - 'preview/v2.1/v22-handoff-v2.js'
      - 'preview/v2.2/**'
      - 'worker/**'
      - 'workers/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/v2.2-integrity-tests.yml'
      - '.github/workflows/deploy-v2.2-proxy.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run browser integrity and OpenAI Proxy unit tests
        run: npm test
      - name: Validate Cloudflare Worker bundle
        run: |
          printf 'OPENAI_API_KEY=test-only\nACCESS_TOKEN=test-only\n' > worker/.dev.vars
          npx --yes wrangler@4.94.0 deploy --dry-run --config worker/wrangler.jsonc
          rm -f worker/.dev.vars
